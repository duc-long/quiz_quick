<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Outer Glow for Q -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Q Letter Gradient -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    
    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity="0.3" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Inner Highlight -->
  <rect width="512" height="512" rx="115" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- The "Q" Shape -->
  <path fill="url(#qGrad)" filter="url(#softShadow)" 
        d="M256,112 c-79.5,0-144,64.5-144,144 c0,79.5,64.5,144,144,144 c30.2,0,58.3-9.3,81.3-25.2 l39.5,39.5 c7.8,7.8,20.5,7.8,28.3,0 c7.8-7.8,7.8-20.5,0-28.3 l-39.5-39.5 C381.5,323.5,396,291.4,396,256 C396,176.5,335.5,112,256,112 z M256,360 c-57.4,0-104-46.6-104-104 c0-57.4,46.6-104,104-104 c57.4,0,104,46.6,104,104 C360,313.4,313.4,360,256,360 z"/>

  <!-- The Checkmark overlapping the Q -->
  <path fill="url(#checkGrad)" filter="url(#softShadow)" 
        d="M344.6,194.2 c-7.5-7.5-19.6-7.5-27.1,0 L219,292.8 l-45.3-45.3 c-7.5-7.5-19.6-7.5-27.1,0 c-7.5,7.5-7.5,19.6,0,27.1 l58.8,58.8 c3.7,3.7,8.6,5.6,13.6,5.6 s9.8-1.9,13.6-5.6 l112-112 C352.1,213.9,352.1,201.7,344.6,194.2 z"/>
</svg>
